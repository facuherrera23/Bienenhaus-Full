name: Deploy GitHub Pages

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

env:
    NODE_VERSION: '22'
    PNPM_VERSION: '11.20.0'
    VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    # Sentry: opcional. Si la var de repo existe, el admin reporta errores.
    VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
    # Release único por deploy → Sentry distingue versiones por commit.
    VITE_APP_VERSION: ${{ github.sha }}

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build landing + admin (out/)
              run: |
                  echo "=== DEBUG ENV VARS ==="
                  echo "VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:0:30}..."
                  echo "VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:0:30}..."
                  echo "SITE_DOMAIN: $SITE_DOMAIN"
                  echo "=========================="
                  node scripts/build-pages.mjs
              env:
                  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
                  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
                  SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
                  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
                  VITE_APP_VERSION: ${{ github.sha }}

            - name: Configure Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
