name: Database Backup

on:
  schedule:
    # Cada día a las 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecución manual

env:
  SUPABASE_PROJECT_ID: bienenhaus
  RETENTION_DAYS: 90

jobs:
  backup:
    name: Backup Database
    runs-on: ubuntu-latest
    permissions:
      contents: write # Para subir artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate backup
        id: backup
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_FILE="supabase-backup-${TIMESTAMP}.sql.gz"
          
          # pg_dump via Supabase CLI (requiere SUPABASE_ACCESS_TOKEN)
          supabase db dump --project-ref ${{ env.SUPABASE_PROJECT_ID }} \
            --schema public \
            --data-only=false \
            --role=postgres \
            --file=- | gzip > "${BACKUP_FILE}"
          
          echo "backup_file=${BACKUP_FILE}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ steps.backup.outputs.timestamp }}
          path: ${{ steps.backup.outputs.backup_file }}
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0 # Ya viene comprimido

      - name: Cleanup old backups (opcional - GitHub lo hace por retention-days)
        run: |
          echo "Los backups antiguos se eliminan automáticamente por la política de retención de GitHub Actions (${{ env.RETENTION_DAYS }} días)"

